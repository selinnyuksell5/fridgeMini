name: fridgemini
description: "FridgeMini - Akıllı Buzdolabı Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.1
  flutter_screenutil: ^5.9.0
  flutter_animate: ^4.2.0
  
  # State Management
  provider: ^6.1.2
  
  # Firebase - Güncellenmiş versiyonlar
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  
  # Form & Validation
  form_validator: ^2.1.1
  
  # File & Network
  image_picker: ^1.2.3
  http: ^1.2.1
  path_provider: ^2.1.2
  path: ^1.8.3
  
  # AI & ML
  google_generative_ai: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/